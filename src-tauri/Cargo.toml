[package]
name = "polychat"
version = "1.0.5"
description = "Multi-platform AI web client"
authors = ["PolyChat"]
edition = "2021"

[lib]
name = "polychat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.8.5", features = ["unstable"] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
