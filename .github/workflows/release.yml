name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG Apple Silicon
            os: macos-latest
            bundle: dmg
            artifact-name: polychat-macos-arm64-dmg
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS DMG Intel
            os: macos-13
            bundle: dmg
            artifact-name: polychat-macos-x64-dmg
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows NSIS
            os: windows-latest
            bundle: nsis
            artifact-name: polychat-windows-nsis
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-path }}
          draft: false
          prerelease: false
